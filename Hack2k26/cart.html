<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

<header class="m2-header">
    <a href="index.html" class="m2-logo">🍽️ FoodieHub</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="menu.html">Our Food Menu</a>

<section class="cart-section">
    <h1>My Shopping Cart 🛒</h1>

    <div class="cart-layout">
        <div class="cart-items" id="cartItems"></div>

        <div class="cart-summary">
            <h2>Order Summary</h2>

            <p>Delivery Fee: <span>₹30</span></p>
            <h3>Total: <span id="cartTotal">₹0</span></h3>

            <a href="checkout.html" id="checkoutLink" class="checkout-btn">
                Proceed to Checkout →
            </a>

            <a href="menu.html" class="continue-btn">
                Continue Shopping
            </a>
        </div>
    </div>
</section>

</footer>
