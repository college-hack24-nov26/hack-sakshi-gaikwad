<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub | Cart</title>
  <link rel="stylesheet" href="member2.css">
</head>
<body>

<header class="m2-header">
  <a href="index.html" class="m2-logo">FoodieHub</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html">Cart 🛒</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<section class="cart-section">
  <h1>My Shopping Cart</h1>

  <div class="cart-layout">
    <div id="cartItems" class="cart-items"></div>

    <div class="cart-summary">
      <h2>Order Summary</h2>
      <p>Subtotal: <strong id="cartSubtotal">₹0</strong></p>
      <p>Delivery: <strong id="deliveryFee">₹30</strong></p>
      <hr>
      <h3>Total: <span id="cartTotal">₹0</span></h3>
      <a href="checkout.html" class="checkout-btn" id="checkoutLink">Proceed to Checkout</a>
      <a href="menu.html" class="continue-btn">Continue Shopping</a>
    </div>
  </div>
</section>

<footer class="m2-footer">
  <p>© 2026 FoodieHub. All Rights Reserved.</p>
</footer>

<script src="member2.js"></script>
</body>
</html>
