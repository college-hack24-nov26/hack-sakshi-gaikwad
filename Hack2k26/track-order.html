<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub | Track Order</title>
  <link rel="stylesheet" href="member3.css">
</head>
<body>

<header class="m3-header">
  <a href="index.html" class="m3-logo">FoodieHub</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="restaurants.html">Restaurants</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<section class="track-section">
  <div class="track-card">
    <h1>Track Your Order</h1>
    <p>Enter your Order ID to check order status.</p>

    <form id="trackForm">
      <input type="text" id="orderId"
        placeholder="Enter Order ID" required>
      <button type="submit">Track Order</button>
    </form>

    <p id="trackMessage" role="status"></p>

    <div id="orderResult" hidden>
      <h2>Order Status</h2>

      <div class="tracking-steps">
        <div class="tracking-step">
          <span>1</span>
          <p>Order Placed</p>
        </div>

        <div class="tracking-step">
          <span>2</span>
          <p>Preparing</p>
        </div>

        <div class="tracking-step">
          <span>3</span>
          <p>Out for Delivery</p>
        </div>

        <div class="tracking-step">
          <span>4</span>
          <p>Delivered</p>
        </div>
      </div>

      <p id="currentStatus"></p>
    </div>
  </div>
</section>

<footer class="m3-footer">
  <p>© 2026 FoodieHub. All Rights Reserved.</p>
</footer>

<script src="member3.js"></script>
</body>
</html>
