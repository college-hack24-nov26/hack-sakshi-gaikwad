<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodieHub | Login</title>
  <link rel="stylesheet" href="member3.css">
</head>
<body>

<header class="m3-header">
  <a href="index.html" class="m3-logo">FoodieHub</a>
  <nav>
    <a href="index.html">Home</a>
    <a href="restaurants.html">Restaurants</a>
    <a href="menu.html">Menu</a>
    <a href="cart.html">Cart</a>
    <a href="login.html">Login</a>
    <a href="signup.html">Signup</a>
  </nav>
</header>

<section class="auth-section">
  <div class="auth-card">
    <h1>Welcome Back!</h1>
    <p>Login to your FoodieHub account</p>

    <form id="loginForm">
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="Enter your email" required>

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="Enter password" required>

      <button type="submit">Login</button>
      <p id="loginMessage" role="status"></p>
    </form>

    <p class="auth-link">
      Don't have an account?
      <a href="signup.html">Create Account</a>
    </p>
  </div>
</section>

<footer class="m3-footer">
  <p>© 2026 FoodieHub. All Rights Reserved.</p>
</footer>

<script src="member3.js"></script>
</body>
</html>
